plugins { id 'com.android.application' }

android {
    namespace 'org.ghostnet.demo'
    compileSdk 35
    defaultConfig {
        applicationId 'org.ghostnet.demo'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':mesh')
}
